# Training configuration — optimized for NVIDIA GeForce RTX 3060 (Ampere architecture)
# VRAM Budget:
#   - ViT-Base (crop_classifier) @ batch_size 32 with AMP: ~3.5 GB VRAM
#   - EfficientNet-B0 (disease_classifier) @ batch_size 32 with AMP: ~1.8 GB VRAM
# Safe for both RTX 3060 Laptop (6 GB) and RTX 3060 Desktop (12 GB).

seed: 42
img_size: 224
batch_size: 32
num_workers: 4
epochs: 25
lr: 0.0003
weight_decay: 0.05
early_stopping_patience: 5

# GPU & Hardware Acceleration (RTX 3060 / Ampere)
device: "cuda"              # Use "cuda" or "cuda:0" (auto falls back to "cpu" if unavailable)
mixed_precision: true       # PyTorch Automatic Mixed Precision (AMP FP16) for 2x speedup & halved VRAM
tf32: true                  # TensorFloat-32 on Ampere Tensor Cores (3rd gen)
benchmark: true             # cuDNN kernel benchmark autotuning
pin_memory: true            # Fast asynchronous pinned-memory host-to-device DMA transfer

crop_classifier:
  model_name: vit_base_patch16_224
  manifest: data/processed/manifest.csv
  class_weights: data/processed/class_weights_crop.json
  output_dir: models/crop_classifier

disease_classifier:
  model_name: efficientnet_b0
  manifest: data/processed/manifest.csv
  class_weights_dir: data/processed/class_weights_disease
  output_dir: models/disease_classifier

